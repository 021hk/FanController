name: Build Windows Installer

# ============================================================
# This workflow builds the FanController installer (.exe)
# automatically on GitHub's servers. No need to install
# Python, Inno Setup, or anything else on your PC.
#
# After this runs, the installer will be available as a
# downloadable artifact on the Actions page.
# ============================================================

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # manual trigger from Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: pc_app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywin32

      - name: Download LibreHardwareMonitor (full app, not just DLL)
        working-directory: pc_app
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v0.9.6/LibreHardwareMonitor.zip'
          Write-Host "Downloading from $url"
          Invoke-WebRequest -Uri $url -OutFile lhm.zip
          Write-Host "Extracting..."
          Expand-Archive -Path lhm.zip -DestinationPath lhm_extracted -Force
          
          # We need LibreHardwareMonitor.exe (the full app, not just the DLL)
          # It will be launched as a background process at runtime
          $exe = Get-ChildItem -Path lhm_extracted -Recurse -Filter 'LibreHardwareMonitor.exe' | Select-Object -First 1
          if ($exe) { 
            Copy-Item $exe.FullName -Destination '.' -Force
            Write-Host "Copied: $($exe.FullName) (size: $($exe.Length) bytes)"
          } else {
            Write-Host "ERROR: LibreHardwareMonitor.exe not found in archive!"
            exit 1
          }
          
          # Also copy the DLL and config (LHM.exe needs them)
          $dll = Get-ChildItem -Path lhm_extracted -Recurse -Filter 'LibreHardwareMonitorLib.dll' | Select-Object -First 1
          if ($dll) { 
            Copy-Item $dll.FullName -Destination '.' -Force
            Write-Host "Copied: $($dll.FullName)"
          }
          
          $cfg = Get-ChildItem -Path lhm_extracted -Recurse -Filter 'LibreHardwareMonitor.exe.config' | Select-Object -First 1
          if ($cfg) { 
            Copy-Item $cfg.FullName -Destination '.' -Force
            Write-Host "Copied: $($cfg.FullName)"
          }
          
          $hid = Get-ChildItem -Path lhm_extracted -Recurse -Filter 'HidSharp.dll' | Select-Object -First 1
          if ($hid) { 
            Copy-Item $hid.FullName -Destination '.' -Force
            Write-Host "Copied: $($hid.FullName)"
          }
          
          # Copy ALL DLLs from LHM (it has many dependencies)
          Get-ChildItem -Path lhm_extracted -Recurse -Filter '*.dll' | ForEach-Object {
            Copy-Item $_.FullName -Destination '.' -Force
          }
          
          # Cleanup
          Remove-Item lhm.zip -Force
          Remove-Item lhm_extracted -Recurse -Force
          
          Write-Host "`nFiles in pc_app:"
          Get-ChildItem -Filter '*.dll' | Format-Table Name, Length
          Get-ChildItem -Filter '*.exe' | Format-Table Name, Length

      - name: Generate icon
        working-directory: pc_app
        run: python icon_generator.py

      - name: Build executable with PyInstaller
        working-directory: pc_app
        run: |
          python -m PyInstaller fan_controller.spec --noconfirm --clean
          dir dist\FanController

      - name: Copy extra files to dist
        working-directory: pc_app
        shell: pwsh
        run: |
          foreach ($f in @('LibreHardwareMonitorLib.dll','LibreHardwareMonitorLib.dll.config','HidSharp.dll','GameMode_ON.bat','GameMode_OFF.bat','icon.ico')) {
            if (Test-Path $f) { Copy-Item $f -Destination 'dist\FanController\' -Force }
          }
          if (Test-Path 'LibreHardwareMonitorLib.resources') {
            Copy-Item 'LibreHardwareMonitorLib.resources' -Destination 'dist\FanController\' -Recurse -Force
          }

      - name: Compile installer with Inno Setup
        working-directory: pc_app
        run: |
          # Inno Setup 6 is pre-installed on windows-latest runners
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          dir dist\*.exe

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanController-Setup-v1.0.0
          path: pc_app/dist/FanController-Setup-v*.exe
          retention-days: 90

      - name: Upload portable folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanController-Portable
          path: pc_app/dist/FanController/
          retention-days: 90

      - name: Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pc_app/dist/FanController-Setup-v*.exe
          name: FanController ${{ github.ref_name }}
          draft: false
          prerelease: false
